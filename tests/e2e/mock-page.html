<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>두 개의 격자 비교하기 | 코드트리</title>
<style>body{font-family:sans-serif;margin:0;display:flex;height:100vh}#left{flex:1;padding:20px;overflow:auto}#right{flex:1;padding:20px;background:#f4f4f4}

<body>
<div id="left">
  <nav>코드트리 · 학습하기</nav>
  <h1>두 개의 격자 비교하기</h1>
  <p>Easy</p>
  <h3>문제</h3>
  <p>n × m 크기의 격자 두 개가 주어집니다. 같은 위치의 값이 같으면 0, 다르면 1을 출력하세요.
  <span class="katex"><annotation encoding="application/x-tex">1 \le n, m \le 100</annotation></span></p>
  <h3>입력 형식</h3><p>첫째 줄에 n과 m이 주어집니다.</p>
  <h3>출력 형식</h3><p>n줄에 걸쳐 m개의 수를 출력합니다.</p>
  <h3>제한</h3><p>1 ≤ n, m ≤ 100</p>
</div>
<div id="right">
  <div class="monaco-editor" data-uri="inmemory://model/1"><pre>n, m = map(int, input().split())</pre></div>
  <div><span>테스트케이스</span></div>
  <div id="result"><span>결과</span></div>
  <button id="run">코드 실행</button> <button>제출 및 채점</button>
</div>
<script>
localStorage.setItem('ide-storage', JSON.stringify({state:{code:'n, m = map(int, input().split())\nprint(n, m)\n', language:'Python3'}, version:0}));
